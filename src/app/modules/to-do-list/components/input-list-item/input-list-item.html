@for (item of inputListItems; track item.id) {
<label class="input-label-text" [for]="item.id">
    <input type="checkbox" #inputCheckbox [checked]="item.checked"
        (input)="updateItemCheckbox(item.id, inputCheckbox.checked)" />

    <input type="text" #inputValue [id]="item.id" [value]="item.value" placeholder="Adicione um valor"
        (input)="updateItemText(item.id, inputValue.value)" />

    <small class="created-at">
        Criado em {{ item.createdAt | date: 'dd/MM/yyyy HH:mm' }}
    </small>

    <button class="btn btn-danger-circle" title="Delete este item" (click)="deleteItem(item.id)"></button>
</label>
}
